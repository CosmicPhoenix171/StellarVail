<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarVail - Music Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="show-ui-hint">Press Escape or click anywhere to show UI</div>
    <div class="aurora-sky" aria-hidden="true">
        <div class="aurora-noise"></div>
    </div>
    <div class="app-shell">
        <div class="content-column">
            <main class="main-content">
                <header class="top-bar">
                    <div class="brand-inline">
                        <h1>Stellar Vail</h1>
                        <p>Journey Through Sound</p>
                    </div>
                    <div class="sort-controls">
                        <span class="sort-label">Sort by:</span>
                        <button id="sort-rating-btn" class="sort-btn" onclick="setSortMode('rating')">⭐ Rating</button>
                        <button id="sort-date-btn" class="sort-btn active" onclick="setSortMode('date')">📅 Newest</button>
                    </div>
                    <div class="user-pill" onclick="showLoginPopup()" title="Click to sign in">
                        <span class="status-dot"></span>
                        <span id="user-name-display">Guest</span>
                    </div>
                </header>
            </main>

            <section class="songs-grid" id="songs-container">
                <!-- Songs will be dynamically loaded here -->
            </section>
        </div>

        <aside class="now-playing-panel">
            <div class="panel-header">
                <h3>Now Playing</h3>
                <div class="panel-controls">
                    <button id="random-btn" onclick="playRandomSong()" title="Surprise me">🎲 Surprise Me</button>
                    <button id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">🔀 Shuffle: OFF</button>
                    <button id="hide-ui-btn" onclick="toggleHideUI()" title="Hide UI to watch stars">👁️ Hide UI</button>
                </div>
            </div>
            <div id="now-playing-card" class="now-playing-card">
                <p class="no-song-playing">Select a song to play</p>
            </div>
        </aside>

        <footer class="player-bar">
            <audio id="audio-player" controls controlsList="nodownload" oncontextmenu="return false;"></audio>
        </footer>
    </div>

    <!-- Rating Popup Modal -->
    <div id="rating-popup" class="rating-popup-overlay" style="display: none;">
        <div class="rating-popup-modal">
            <h2>What do you think?</h2>
            <p id="rating-popup-song-title" class="rating-popup-song"></p>
            <div class="rating-popup-stars" id="rating-popup-stars">
                <span class="popup-star" data-rating="1">★</span>
                <span class="popup-star" data-rating="2">★</span>
                <span class="popup-star" data-rating="3">★</span>
                <span class="popup-star" data-rating="4">★</span>
                <span class="popup-star" data-rating="5">★</span>
            </div>
            <p class="rating-popup-hint">Click a star to rate</p>
            <button id="rating-popup-skip" class="rating-popup-skip-btn">Skip Rating</button>
        </div>
    </div>

    <!-- Login Popup Modal -->
    <div id="login-popup" class="rating-popup-overlay" style="display: none;">
        <div class="rating-popup-modal login-modal">
            <h2>Sign In</h2>
            <p class="login-hint">Enter a username to sync your ratings across devices</p>
            <input type="text" id="login-username" class="login-input" placeholder="Enter username..." maxlength="20" autocomplete="off">
            <div class="login-buttons">
                <button id="login-submit-btn" class="login-submit-btn">Sign In</button>
                <button id="login-cancel-btn" class="rating-popup-skip-btn">Cancel</button>
            </div>
            <div id="login-status" class="login-status"></div>
            <button id="logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
