<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarVail - Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="aurora-sky" aria-hidden="true">
        <div class="aurora-noise"></div>
    </div>

    <main class="admin-shell">
        <header class="admin-header">
            <div class="brand-inline">
                <h1>Stellar Vail</h1>
                <p>Analytics Mode</p>
            </div>
            <div class="admin-actions">
                <button id="admin-migrate-btn" class="admin-mode-btn" type="button" title="Pull ratings/comments/listens from old Firebase IDs into the current ones">Pull Old Data</button>
                <button id="admin-refresh-btn" class="admin-mode-btn" type="button">Refresh</button>
                <button id="normal-mode-btn" class="admin-mode-btn" type="button">Normal Mode</button>
            </div>
        </header>

        <section id="admin-locked" class="admin-locked" hidden>
            <h2>Admin sign-in required</h2>
            <p>Sign in as Phoenix on the main page to view song analytics.</p>
            <button id="locked-normal-btn" class="admin-mode-btn" type="button">Back to Normal Mode</button>
        </section>

        <section id="admin-dashboard" class="admin-dashboard" hidden>
            <div id="admin-summary" class="admin-summary-grid"></div>
            <div class="admin-section-heading">
                <h2>Song Analytics</h2>
                <span id="admin-updated-at">Loading...</span>
            </div>
            <div id="admin-song-list" class="admin-song-list"></div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
